services:
  - type: web
    name: altair-commerce
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: AltairCommerce
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: altair-commerce
          property: host
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: altair-commerce-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: altair-commerce-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: altair-commerce-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: altair-commerce-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: altair-commerce-db
          property: password

databases:
  - name: altair-commerce-db
    plan: standard
    databaseName: altair_commerce
    user: altair_admin
